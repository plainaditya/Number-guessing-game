<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A clean, modern, and minimalist number guessing game by Aditya Singh.">
    <title>Number Guess | Aditya Singh</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
</head>
<body>

    <!-- Minimal Header -->
    <header class="site-header">
        <div class="brand-wrap">
            <span class="brand-title">Number Guess</span>
            <span class="brand-badge">Classic</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="soundToggleBtn" type="button" title="Toggle Sound" aria-label="Toggle sound">
                <span id="soundIcon">🔊</span>
            </button>
            <a href="https://plainaditya-portfolio.vercel.app" class="portfolio-link" target="_blank" rel="noopener noreferrer">
                Portfolio ↗
            </a>
            <a href="https://github.com/plainaditya/Number-guessing-game" class="icon-btn" target="_blank" rel="noopener noreferrer" title="View Source on GitHub">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Difficulty Chips -->
        <div class="difficulty-selector" role="group" aria-label="Select Difficulty">
            <button class="diff-chip" data-diff="easy" type="button">1 – 50</button>
            <button class="diff-chip active" data-diff="medium" type="button">1 – 100</button>
            <button class="diff-chip" data-diff="hard" type="button">1 – 200</button>
        </div>

        <!-- The Game Card -->
        <div class="game-card" id="gameCard">

            <!-- Card Header: Lives and Bounds -->
            <div class="card-header-status">
                <div class="attempts-pills-bar" id="attemptsPills" aria-label="Attempts remaining"></div>
                <div class="range-badge" id="rangeBadge">1 – 100</div>
            </div>

            <!-- Central Feedback & Prompt -->
            <div class="prompt-area">
                <h1 class="prompt-title" id="promptTitle">Guess the number</h1>
                <p class="prompt-feedback" id="promptFeedback">Enter an integer between 1 and 100.</p>
            </div>

            <!-- Range Track (Visual Search Space) -->
            <div class="range-track-container">
                <div class="range-labels">
                    <span id="rangeMin">1</span>
                    <span id="rangeMax">100</span>
                </div>
                <div class="range-bar">
                    <div class="range-fill" id="rangeFill"></div>
                </div>
            </div>

            <!-- Input Group -->
            <form id="guessForm" onsubmit="return false;">
                <div class="input-group">
                    <input 
                        type="number" 
                        class="guess-field" 
                        id="guessInput" 
                        placeholder="Your guess" 
                        autocomplete="off" 
                        inputmode="numeric"
                        autofocus
                    >
                    <button class="btn-submit" id="submitBtn" type="button">Guess</button>
                </div>
            </form>

            <!-- Card Actions -->
            <div class="card-actions-row">
                <button class="subtle-btn" id="clueToggleBtn" type="button">
                    <span>Need a clue?</span>
                </button>
                <button class="subtle-btn" id="newRoundBtn" type="button">
                    <span>New round</span>
                </button>
            </div>

            <!-- Clue Box -->
            <div class="clue-box" id="clueBox">
                <span id="clueText">Clue details</span>
            </div>

            <!-- Guess History (Wordle Style) -->
            <div class="history-wrap">
                <div class="history-label">Previous Guesses</div>
                <div class="history-chips" id="historyChips"></div>
            </div>

        </div>

    </main>

    <!-- Clean Minimal Footer -->
    <footer class="site-footer">
        Designed &amp; built by <a href="https://plainaditya-portfolio.vercel.app" target="_blank" rel="noopener noreferrer">Aditya Singh</a>.
    </footer>

    <!-- Result Modal -->
    <div class="modal-backdrop" id="resultModal">
        <div class="modal-dialog">
            <h3 id="modalHeading">You got it!</h3>
            <p id="modalSub">Found the number in 4 attempts.</p>
            <div class="modal-metrics">
                <div class="metric-item">
                    <span id="metricSecret">--</span>
                    <span>Secret</span>
                </div>
                <div class="metric-item">
                    <span id="metricAttempts">--</span>
                    <span>Guesses</span>
                </div>
                <div class="metric-item">
                    <span id="metricTime">--</span>
                    <span>Time</span>
                </div>
            </div>
            <button class="btn-action-primary" id="modalPlayAgainBtn" type="button">Play Again</button>
        </div>
    </div>

    <!-- Confetti Canvas -->
    <canvas id="confettiCanvas"></canvas>

    <!-- Game Script -->
    <script src="script.js"></script>
</body>
</html>
